name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0)'
        required: false
        default: ''

jobs:
  # ─────────────────────────────────────────
  #  macOS — DMG + ZIP (x64 & arm64)
  # ─────────────────────────────────────────
  build-mac:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS (x64 + arm64)
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-builds
          path: |
            dist/*.dmg
            dist/*-mac.zip
            dist/*-arm64-mac.zip
          retention-days: 7

  # ─────────────────────────────────────────
  #  Windows — NSIS installer + Portable + ZIP
  # ─────────────────────────────────────────
  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows (x64 + arm64)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            dist/*.exe
            dist/*-win.zip
          retention-days: 7

  # ─────────────────────────────────────────
  #  Linux — AppImage + DEB + RPM + tar.gz
  # ─────────────────────────────────────────
  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libnotify-dev \
            libgconf-2-4 \
            libnss3 \
            libxss1 \
            libxtst6 \
            xauth \
            xvfb \
            rpm \
            fakeroot

      - name: Install dependencies
        run: npm ci

      - name: Build Linux (x64 + arm64)
        run: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
          retention-days: 7

  # ─────────────────────────────────────────
  #  Release — attach all artifacts to GitHub Release
  # ─────────────────────────────────────────
  release:
    name: Create Release
    needs: [build-mac, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BotBrowser Control ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/mac-builds/*.dmg
            artifacts/mac-builds/*.zip
            artifacts/windows-builds/*.exe
            artifacts/windows-builds/*.zip
            artifacts/linux-builds/*.AppImage
            artifacts/linux-builds/*.deb
            artifacts/linux-builds/*.rpm
            artifacts/linux-builds/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate cross-platform release manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - "$RELEASE_TAG" "$REPOSITORY" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          from urllib.parse import quote

          tag, repository = sys.argv[1:]
          if not tag.startswith('v'):
              raise SystemExit(f'Expected a version tag, got {tag!r}')
          version = tag[1:]
          specs = [
              ('win32', 'x64', 'zip', 'windows-builds', f'BotBrowser Control-{version}-win.zip'),
              ('win32', 'arm64', 'zip', 'windows-builds', f'BotBrowser Control-{version}-arm64-win.zip'),
              ('darwin', 'x64', 'zip', 'mac-builds', f'BotBrowser Control-{version}-mac.zip'),
              ('darwin', 'arm64', 'zip', 'mac-builds', f'BotBrowser Control-{version}-arm64-mac.zip'),
              ('linux', 'x64', 'appimage', 'linux-builds', f'BotBrowser Control-{version}.AppImage'),
              ('linux', 'arm64', 'appimage', 'linux-builds', f'BotBrowser Control-{version}-arm64.AppImage'),
              ('linux', 'x64', 'tar.gz', 'linux-builds', f'BotBrowser Control-{version}.tar.gz'),
              ('linux', 'arm64', 'tar.gz', 'linux-builds', f'BotBrowser Control-{version}-arm64.tar.gz'),
          ]
          assets = []
          for platform, arch, format, directory, name in specs:
              path = pathlib.Path('artifacts') / directory / name
              if not path.is_file():
                  raise SystemExit(f'Missing {platform}/{arch} {format} asset: {path}')
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assets.append({
                  'platform': platform,
                  'arch': arch,
                  'format': format,
                  'version': version,
                  'name': name,
                  'url': f'https://github.com/{repository}/releases/download/{quote(tag, safe="")}/{quote(name)}',
                  'sha256': digest,
              })
          pathlib.Path('manifest.json').write_text(
              json.dumps({'version': version, 'assets': assets}, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload cross-platform release manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" manifest.json --clobber
